  <div class="relative min-h-screen flex bg-light-surface">

        </div>
        <nav class="flex flex-col gap-1">
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-DEFAULT bg-light-secondary-container text-light-on-secondary-container">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Dashboard</span>
          </div>
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-DEFAULT text-light-on-surface-variant">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">My Tasks</span>
          </div>
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-DEFAULT text-light-on-surface-variant">
            <i data-lucide="sun" class="w-4 h-4"></i>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Today</span>
          </div>
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-DEFAULT text-light-on-surface-variant">
            <i data-lucide="calendar-days" class="w-4 h-4"></i>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Upcoming</span>
          </div>
        </nav>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="bg-light-surface border-b border-light-outline-variant px-8 py-3.5">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
          <div class="w-80 h-9 rounded-DEFAULT bg-light-surface-container-lowest border border-light-outline-variant"></div>
          <div class="flex items-center gap-3">
            <div class="px-4 py-2 rounded-DEFAULT bg-light-primary-container text-light-on-primary-container">

            <img src="https://lh3.googleusercontent.com/aida/ALJJyrBjt60Db1qVzD1OGmt7flyJbbN8YC_QFIQx6jue6sLcpSufMkRiDiYvd0CwB097GdcnsgXILRGEwhCLRj5VVKfWG4meSvpeY2sRBheZg620vE-4c3IYl_3-rzeEWvTjbliKq_TkyVN_1cl82yJ4s6U-yB2hZYgWizqTFuzl2sfqDBJhHcqae26T0avtQIVQT3n_G9WF2-Rx9Jpy-DKpbDrmkRG6u9LUJyY94Q_0lFlNapcF9zE" alt="Maya Lin profile avatar" class="w-8 h-8 rounded-full object-cover" data-stitch-original-src="c17134d603e9130e===../../images/avatar_user.jpg">
          </div>
        </div>
      </header>
      <main class="flex-1 px-8 py-8">
        <div class="max-w-6xl mx-auto flex flex-col gap-6 opacity-40">
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Good afternoon 👋</h1>
          <div class="grid grid-cols-3 gap-5">
            <div class="h-28 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant"></div>
            <div class="h-28 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant"></div>
            <div class="h-28 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant"></div>
          </div>
          <div class="h-64 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant"></div>
        </div>

            <h2 id="add-modal-title" data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface">Add New Task</h2>
            <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant mt-0.5">Capture a task with due date, priority, and category.</p>
          </div>
          <a href="../dashboard/Dashboard.html" aria-label="Close modal" class="inline-flex items-center justify-center w-8 h-8 rounded-sm text-light-on-surface-variant hover:bg-light-surface-container-low transition-colors duration-state-change">
            <i data-lucide="x" class="w-4 h-4"></i>
          </a>
        </header>

        <form class="px-6 py-5 flex flex-col gap-4">
          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Task title</span>
            <input type="text" value="Design interactive onboarding checklist" placeholder="e.g., Finalize Q4 roadmap" class="w-full px-3.5 py-2.5 rounded-DEFAULT bg-light-surface-container-lowest border border-accent ring-2 ring-accent/20 text-light-on-surface font-body text-body-md focus:outline-none">
          </label>

          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Description</span>
            <textarea rows="3" placeholder="Add context, links, or key deliverables..." class="w-full px-3.5 py-2.5 rounded-DEFAULT bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-body text-body-md focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 resize-none">Include 3 quick-start steps, progress bar, and subtle confetti micro-interaction on completion.</textarea>
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="flex flex-col gap-1.5">
              <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Due date</span>
              <input type="date" value="2026-11-26" class="w-full px-3.5 py-2.5 rounded-DEFAULT bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-body text-body-md focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20">
            </label>

            <label class="flex flex-col gap-1.5">
              <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Category</span>
              <select class="w-full px-3.5 py-2.5 rounded-DEFAULT bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-body text-body-md focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20">
                <option selected>Product Design</option>
                <option>Engineering</option>
                <option>Marketing</option>
                <option>Personal</option>
              </select>
            </label>
          </div>

          <div class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Priority</span>
            <div class="grid grid-cols-3 gap-2.5">
              <label class="cursor-pointer">
                <input type="radio" name="modal-priority" value="High" checked class="peer sr-only">
                <span class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-DEFAULT border border-light-error bg-light-error-container text-light-on-error-container">
                  <span class="w-2 h-2 rounded-full bg-light-error"></span>
                  <span data-design-text-token="label-md" class="font-label text-label-md">High</span>
                </span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="modal-priority" value="Medium" class="peer sr-only">
                <span class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-DEFAULT border border-light-outline-variant text-light-on-surface-variant hover:bg-light-surface-container-low">
                  <span class="w-2 h-2 rounded-full bg-warning"></span>
                  <span data-design-text-token="label-md" class="font-label text-label-md">Medium</span>
                </span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="modal-priority" value="Low" class="peer sr-only">
                <span class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-DEFAULT border border-light-outline-variant text-light-on-surface-variant hover:bg-light-surface-container-low">
                  <span class="w-2 h-2 rounded-full bg-success"></span>
                  <span data-design-text-token="label-md" class="font-label text-label-md">Low</span>
                </span>
              </label>
            </div>
          </div>
        </form>

        <footer class="flex items-center justify-end gap-3 px-6 py-4 bg-light-surface-container-low/60 border-t border-light-outline-variant">
          <a href="../dashboard/Dashboard.html" class="px-4 py-2 rounded-DEFAULT bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface hover:bg-light-surface-container-low transition-colors duration-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Cancel</span>
          </a>
          <a href="../dashboard/Dashboard.html" class="px-4 py-2 rounded-DEFAULT bg-light-primary text-light-on-primary hover:bg-light-primary-container transition-colors duration-state-change shadow-sm">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Save Task</span>
          </a>
        </footer>
      </section>
    </div>

  </div>
